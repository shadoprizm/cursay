name: Windows Build

on:
  push:
    paths:
      - "windows/**"
      - "backend/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "backend/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build release installer
        shell: pwsh
        run: .\windows\scripts\build.ps1
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cursay-windows-x64
          path: |
            windows/artifacts/Cursay-*-windows-x64-setup.exe
            windows/artifacts/Cursay-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
