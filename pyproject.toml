[project]
name = "cursay"
version = "1.2.1"
description = "Free, local-first, system-wide dictation for Ubuntu GNOME"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "shadoprizm" }]
keywords = ["dictation", "speech-to-text", "whisper", "ubuntu", "wayland", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/shadoprizm/cursay"
Issues = "https://github.com/shadoprizm/cursay/issues"
Source = "https://github.com/shadoprizm/cursay"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"cursay/app.py" = ["E402"]
"tests/test_layout.py" = ["E402"]
